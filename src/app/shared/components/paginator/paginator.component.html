<div *ngIf="totalPages > 1" style="
  background:var(--bg-card);
  border:1.5px solid var(--border);
  border-radius:12px;
  padding:12px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
">
  <span style="font-size:11px;color:var(--text-3);">
    Mostrando <strong style="color:var(--text-2);">{{ startItem }}</strong>–<strong style="color:var(--text-2);">{{ endItem }}</strong> de <strong style="color:var(--text-2);">{{ totalItems }}</strong>
  </span>

  <div style="display:flex;align-items:center;gap:4px;">
    <button (click)="previousPage()" [disabled]="currentPage === 1" style="
      width:32px;height:32px;border-radius:8px;
      border:1.5px solid var(--border);
      background:var(--bg-card);
      color:var(--text-2);
      font-size:14px;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      transition:border-color .15s;
    " [style.opacity]="currentPage === 1 ? '.4' : '1'">
      <i class="ti ti-chevron-left"></i>
    </button>

    <button
      *ngFor="let page of pages"
      (click)="goToPage(page)"
      [disabled]="page === '...'"
      style="
        height:32px;min-width:32px;padding:0 6px;border-radius:8px;
        font-family:'Poppins',sans-serif;font-size:11px;font-weight:600;
        cursor:pointer;transition:background .15s,border-color .15s,color .15s;
        display:flex;align-items:center;justify-content:center;
      "
      [style.background]="page === currentPage ? 'var(--accent)' : 'var(--bg-card)'"
      [style.color]="page === currentPage ? '#000' : 'var(--text-2)'"
      [style.border]="page === currentPage ? '1.5px solid var(--accent)' : '1.5px solid var(--border)'"
      [style.cursor]="page === '...' ? 'default' : 'pointer'"
    >{{ page }}</button>

    <button (click)="nextPage()" [disabled]="currentPage === totalPages" style="
      width:32px;height:32px;border-radius:8px;
      border:1.5px solid var(--border);
      background:var(--bg-card);
      color:var(--text-2);
      font-size:14px;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      transition:border-color .15s;
    " [style.opacity]="currentPage === totalPages ? '.4' : '1'">
      <i class="ti ti-chevron-right"></i>
    </button>
  </div>
</div>
