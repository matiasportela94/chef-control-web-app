<div *ngIf="totalPages > 1" class="w-full min-w-0 overflow-hidden rounded-xl border border-surface-200 bg-white px-3 py-4 sm:px-4">
  <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
    <div class="min-w-0 text-center text-xs text-surface-700 sm:text-left sm:text-sm">
      Mostrando <span class="font-medium">{{ startItem }}</span> - <span class="font-medium">{{ endItem }}</span> de <span class="font-medium">{{ totalItems }}</span>
    </div>

    <div class="min-w-0 overflow-x-auto pb-1 scrollbar-hide">
      <div class="flex min-w-max items-center gap-1 sm:gap-2">
        <!-- Previous -->
        <button
          (click)="previousPage()"
          [disabled]="currentPage === 1"
          class="flex items-center justify-center w-8 h-8 rounded-lg border border-surface-300 bg-white text-surface-700 transition-colors hover:bg-surface-50 disabled:opacity-50 disabled:cursor-not-allowed sm:h-9 sm:w-9"
        >
          ‹
        </button>

        <!-- Pages -->
        <button
          *ngFor="let page of pages"
          (click)="goToPage(page)"
          [disabled]="page === '...'"
          [class.bg-surface-900]="page === currentPage"
          [class.text-white]="page === currentPage"
          [class.font-semibold]="page === currentPage"
          [class.hover:bg-surface-50]="page !== currentPage && page !== '...'"
          [class.cursor-default]="page === '...'"
          class="flex h-8 min-w-[2rem] items-center justify-center rounded-lg border border-surface-300 px-2 text-xs text-surface-700 transition-colors sm:h-9 sm:min-w-[2.25rem] sm:text-sm"
        >
          {{ page }}
        </button>

        <!-- Next -->
        <button
          (click)="nextPage()"
          [disabled]="currentPage === totalPages"
          class="flex items-center justify-center w-8 h-8 rounded-lg border border-surface-300 bg-white text-surface-700 transition-colors hover:bg-surface-50 disabled:opacity-50 disabled:cursor-not-allowed sm:h-9 sm:w-9"
        >
          ›
        </button>
      </div>
    </div>
  </div>
</div>
