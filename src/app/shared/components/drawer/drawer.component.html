<!-- Backdrop -->
<div style="
  position:fixed; inset:0;
  background:rgba(0,0,0,0.6);
  z-index:200;
  transition:opacity .25s;
"
  [style.opacity]="isOpen ? '1' : '0'"
  [style.pointerEvents]="isOpen ? 'auto' : 'none'"
  (click)="close()">
</div>

<!-- Panel -->
<aside style="
  position:fixed; top:0; right:0; bottom:0;
  width:30vw; min-width:340px; max-width:420px;
  z-index:300;
  display:flex; flex-direction:column;
  overflow:hidden;
  background:var(--bg-card);
  border-left:1px solid var(--border);
  transition:transform .28s cubic-bezier(.4,0,.2,1);
"
  [style.transform]="isOpen ? 'translateX(0)' : 'translateX(100%)'">

  <!-- Header -->
  <div class="drawer-header"
       [style.background]="accentHeader ? 'var(--accent)' : ''"
       [style.border-bottom]="accentHeader ? '1px solid rgba(0,0,0,.1)' : ''">
    <div>
      <div class="drawer-title" [style.color]="accentHeader ? '#000' : ''">
        @if (titleIcon) { <i [class]="'ti ti-' + titleIcon" style="margin-right:5px;vertical-align:middle;"></i> }{{ title }}
      </div>
      @if (subtitle) {
        <div class="drawer-subtitle" [style.color]="accentHeader ? 'rgba(0,0,0,.5)' : ''">{{ subtitle }}</div>
      }
    </div>
    <button type="button" (click)="close()" class="drawer-close"
            [style.background]="accentHeader ? 'rgba(0,0,0,.15)' : ''"
            [style.color]="accentHeader ? 'rgba(0,0,0,.6)' : ''">
      <i class="ti ti-x"></i>
    </button>
  </div>

  <!-- Body -->
  <div style="flex:1; overflow-y:auto; padding:20px;">
    <ng-content></ng-content>
  </div>

  <!-- Footer slot (optional) -->
  <ng-content select="[drawer-footer]"></ng-content>

</aside>
