<!-- Backdrop -->
<div style="
  position:fixed; inset:0;
  background:rgba(0,0,0,0.6);
  z-index:200;
  transition:opacity .25s;
"
  [style.opacity]="isOpen ? '1' : '0'"
  [style.pointerEvents]="isOpen ? 'auto' : 'none'"
  (click)="close()">
</div>

<!-- Panel -->
<aside style="
  position:fixed; inset-y:0; right:0;
  z-index:300;
  display:flex; flex-direction:column;
  background:var(--bg-card);
  transition:transform .28s cubic-bezier(.4,0,.2,1);
"
  [class.max-w-md]="size === 'sm'"
  [class.max-w-lg]="size === 'md'"
  [class.max-w-2xl]="size === 'lg'"
  [class.max-w-3xl]="size === 'xl'"
  [class.max-w-4xl]="size === '2xl'"
  [class.w-full]="true"
  [style.transform]="isOpen ? 'translateX(0)' : 'translateX(100%)'">

  <!-- Header -->
  <div class="drawer-header">
    <div>
      <div class="drawer-title">{{ title }}</div>
      @if (subtitle) {
        <div class="drawer-subtitle">{{ subtitle }}</div>
      }
    </div>
    <button type="button" (click)="close()" class="drawer-close">
      <i class="ti ti-x"></i>
    </button>
  </div>

  <!-- Body -->
  <div style="flex:1; overflow-y:auto; padding:20px;">
    <ng-content></ng-content>
  </div>

  <!-- Footer slot (optional) -->
  <ng-content select="[drawer-footer]"></ng-content>

</aside>
