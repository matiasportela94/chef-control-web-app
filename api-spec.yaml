components:
  schemas:
    ExecuteIntentRequest:
      required:
      - intent
      type: object
      properties:
        intent:
          type: string
        data:
          type: object
          additionalProperties: true
    ExecuteIntentResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        created:
          type: integer
        skipped:
          type: integer
    InterpretTextRequest:
      required:
      - message
      type: object
      properties:
        message:
          type: string
          maxLength: 500
    InterpretTextResponse:
      type: object
      properties:
        intent:
          type: string
          enum:
          - purchase
          - waste
          - sale
          - stock_adjustment
          - query
          - multi
          - unknown
        confidence:
          type: integer
        needsConfirmation:
          type: boolean
        data:
          type: object
          additionalProperties: true
        responseToUser:
          type: string
    UpdateUserRequest:
      required:
      - name
      - role
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        role:
          type: string
          enum:
          - OWNER
          - MANAGER
          - KITCHEN
          - READONLY
    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        role:
          type: string
        isActive:
          type: boolean
        memberSince:
          type: string
          format: date-time
    UpdateSupplierRequest:
      required:
      - name
      type: object
      properties:
        name:
          maxLength: 255
          minLength: 0
          type: string
        phone:
          maxLength: 20
          minLength: 0
          type: string
        email:
          maxLength: 255
          minLength: 0
          type: string
        address:
          maxLength: 500
          minLength: 0
          type: string
        notes:
          maxLength: 1000
          minLength: 0
          type: string
    SupplierResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
